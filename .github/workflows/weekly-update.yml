name: Weekly Outbound Report Update

on:
  schedule:
    # PRIMARY: Saturday 06:00 Manila. Manila is UTC+8, so that is Friday 22:00
    # UTC — the day-of-week here is Friday (5) even though the report lands on
    # Saturday morning locally.
    - cron: '0 22 * * 5'
    # BACKUP: Saturday 09:00 Manila (01:00 UTC Saturday). GitHub delays
    # scheduled runs under load; the commit step is a no-op when nothing
    # changed, so a successful primary makes this harmless.
    - cron: '0 1 * * 6'
  # Manual trigger — "Run workflow" in the Actions tab.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      # campaigns.json is committed rather than rebuilt here: build_registry.py
      # reads the wave folders in the VS Code workspace, which do not live in
      # this repo. Re-run it locally and commit when a new campaign is added.
      - name: Run outbound report updater
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
          # Preferred send counter: CSV published by OutreachCounts.gs.
          OUTREACH_CSV_URL: ${{ secrets.OUTREACH_CSV_URL }}
          # IMAP fallback — unusable while the Workspace disables app passwords.
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python update_outbound_report.py

      - name: Commit & push updated report
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outbound-report.html data.json
          git diff --staged --quiet || git commit -m "chore: outbound report update $(date -u +'%Y-%m-%d')"
          git push
