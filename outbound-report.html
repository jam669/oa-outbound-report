<script>
(function () {
  "use strict";

  const $   = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g,
    (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  const num = (n) => (n == null ? "—" : Number(n).toLocaleString("en-US"));
  const pct = (n) => (n == null ? "—" : Number(n).toFixed(1) + "%");
  const pct2 = (n) => (n == null ? "—" : Number(n).toFixed(2) + "%");
  const money = (n) => "$" + Number(n || 0).toLocaleString("en-US", { maximumFractionDigits: 0 });

  if (!REPORT) {
    $("subline").textContent = "No data yet.";
    $("app").innerHTML =
      '<div class="panel"><h2>Awaiting first refresh</h2>' +
      '<div class="panel-note">Run <code>python update_outbound_report.py</code> with ' +
      '<code>HUBSPOT_TOKEN</code> set, or trigger the “Weekly Outbound Report Update” ' +
      'action on GitHub. The page fills itself in from that run onward.</div></div>';
    return;
  }

  const T = REPORT.totals || {};

  $("subline").innerHTML =
    "Week of " + esc(REPORT.week_label) + " · updated " + esc(REPORT.generated) +
    ' · <a href="https://jam669.github.io/oa-bd-report/bd-weekly-report.html">BD weekly report →</a>';

  /* ── KPI tiles ─────────────────────────────────────────────────────────── */
  function kpis() {
    const O = REPORT.outreach, W = REPORT.weekly || [];
    const span = W.length
      ? W[W.length - 1].label.split("–")[0] + "– " + W[0].label
      : "reported weeks";

    const tiles = [];
    if (O) {
      tiles.push({ label: "Outreach sent", value: num(T.outreach || O.total),
                   meta: "emails only, no LinkedIn · " + esc(span) });
    }
    tiles.push({ label: "People reached", value: num(T.sent),
                 meta: (T.contacted_this_week
                   ? num(T.contacted_this_week) + " contacted this week"
                   : "distinct humans, all campaigns to date") });
    if (T.connected != null) {
      tiles.push({ label: "Connected", value: num(T.connected),
                   meta: pct2(T.connected_rate) + " · human replies only" });
    }
    tiles.push(
      { label: "DCs held", value: num(T.dc_held),
        meta: T.deals ? num(T.deals) + " campaign deals" : "no deals logged yet" },
      { label: "Pipeline value", value: money(T.pipeline_value),
        meta: T.won ? num(T.won) + " won · " + money(T.won_value) : "open deals" }
    );

    // Two volume numbers in different units over different windows sit side by
    // side here, which invites a comparison that is not meaningful. Say so.
    const explain = '<div class="explain">' +
      "<b>Outreach counts emails; people counts humans.</b> " +
      num(T.outreach || (O ? O.total : 0)) + " emails reached " + num(T.sent) +
      " people because most got two to four follow-ups — and some campaigns were " +
      "built in-session without their list being saved, so those recipients count as " +
      "outreach but cannot be matched to a person here. Outreach is campaign email " +
      "only: candidate sourcing and LinkedIn are excluded." +
      (T.never_sent
        ? " Every email on these lists was sent — " + num(T.never_sent) +
          " addresses simply have no matching HubSpot record (suppressed before " +
          "sending, hard-bounced, or a logging gap), so they are not counted as people reached."
        : "") + "</div>";

    return '<div class="kpis">' + tiles.map((t) =>
      '<div class="kpi' + (t.flag ? " flag" : "") + '">' +
        '<div class="kpi-label">' + esc(t.label) + "</div>" +
        '<div class="kpi-value">' + t.value + "</div>" +
        '<div class="kpi-meta">' + t.meta + "</div>" +
      "</div>").join("") + "</div>" + explain;
  }

  /* ── Attribution notice ────────────────────────────────────────────────── */
  function notice() {
    const wins = (REPORT.wins || []).length, O = REPORT.outreach;
    let msg = "";

    if (!O) {
      msg = "<b>Outreach volume is being under-counted.</b> Without Gmail " +
            "credentials this page counts distinct people on campaign lists saved " +
            "to the workspace — so repeat follow-ups, and any campaign built " +
            "in-session without saving its list, are invisible. Set " +
            "<code>GMAIL_USER</code> and <code>GMAIL_APP_PASSWORD</code> to count " +
            "actual sends, which is what the EOW report measures.";
    } else if (O.unattributed) {
      const pctUnknown = Math.round((O.unattributed / O.total) * 100);
      msg = "<b>" + num(O.unattributed) + " of " + num(O.total) + " sends (" +
            pctUnknown + "%) can't be broken out by campaign</b> — their lists " +
            "were never saved to the workspace, so they count toward totals but " +
            "not to a named campaign below. Committing those sendlists to " +
            "<code>01_Campaigns/</code> and re-running <code>build_registry.py</code> " +
            "names them.";
    }

    if (T.deals > 0 && !wins && !msg) return "";
    if (!T.deals) {
      msg += (msg ? " " : "") +
            "<b>No calls from these campaigns are logged as deals in HubSpot.</b> " +
            "Sends and replies below are measured directly and are reliable; the " +
            "conversion row reads zero because there is nothing in the CRM to count, " +
            "not because nothing happened. Logging outbound-sourced calls as deals " +
            "against the contact or their company makes them appear here automatically.";
    }
    if (wins) {
      msg += (msg ? " " : "") + "<b>" + wins + "</b> call" + (wins === 1 ? "" : "s") +
             " recorded manually in <code>wins.csv</code> are listed separately below " +
             "and are not mixed into the CRM figures.";
    }
    return '<div class="notice">' + msg + "</div>";
  }

  /* ── Weekly update (the EOW, on the page) ──────────────────────────────── */
  function weeklyPanel() {
    const weeks = REPORT.weekly || [];
    if (!weeks.length) return "";
    const w = weeks[0];

    const stats = [
      ["Outreach",        num(w.outreach)],
      ["Connected to",    num(w.connected)],
      ["DCs held",        num(w.dc_held)],
      ["Proposals",       num(w.proposals)],
      ["Deals in delivery", num(w.deals_in_delivery)],
    ].filter((s) => s[1] !== "0" || s[0] === "Outreach");

    let html = '<div class="panel"><div class="chart-head"><div>' +
      "<h2>Week of " + esc(w.label) +
        (w.provisional ? ' <span class="pill manual">provisional</span>' : "") + "</h2>" +
      '<div class="panel-note">' + esc(w.headline || "") +
        (w.note ? ' <span class="dim">' + esc(w.note) + "</span>" : "") + "</div>" +
      "</div>" +
      '<button class="toggle" id="wk-toggle">Earlier weeks</button>' +
      "</div>" +
      '<div class="wk-stats">' + stats.map((s) =>
        '<div class="wk-stat"><div class="wk-stat-v">' + s[1] + "</div>" +
        '<div class="wk-stat-l">' + esc(s[0]) + "</div></div>").join("") + "</div>";

    if ((w.channels || []).length) {
      const max = Math.max(...w.channels.map((c) => c[1]), 1);
      html += '<div class="chan">' + w.channels.map((c) =>
        '<div class="chan-row"><span class="chan-name">' + esc(c[0]) + "</span>" +
        '<span class="bar-track chan-bar"><span class="bar-fill" style="width:' +
          Math.round((c[1] / max) * 100) + '%;background:var(--s-sent)"></span></span>' +
        '<span class="chan-n">' + num(c[1]) + "</span></div>").join("") + "</div>";
    }

    if ((w.highlights || []).length) {
      html += "<ul class=\"hl\">" + w.highlights.map((h) =>
        "<li>" + esc(h) + "</li>").join("") + "</ul>";
    }

    // Earlier weeks, collapsed — the current week is what matters at a glance.
    html += '<div id="wk-earlier" hidden><div class="table-scroll"><table><thead><tr>' +
      "<th>Week</th><th class=\"num\">Outreach</th><th class=\"num\">Connected</th>" +
      "<th class=\"num\">DCs held</th><th>Headline</th></tr></thead><tbody>" +
      weeks.slice(1).map((p) =>
        "<tr><td>" + esc(p.label) + "</td>" +
        '<td class="num">' + num(p.outreach) + "</td>" +
        '<td class="num">' + num(p.connected) + "</td>" +
        '<td class="num">' + num(p.dc_held) + "</td>" +
        '<td class="name dim">' + esc(p.headline || "") + "</td></tr>").join("") +
      "</tbody></table></div></div></div>";
    return html;
  }

  /* ── Weekly trend ──────────────────────────────────────────────────────── */
  // Volume is Gmail's send count where available; without Gmail credentials the
  // page falls back to distinct people reached, and says so in the legend.
  const SERIES = [
    REPORT.outreach
      ? { key: "outreach", label: "Outreach sent",  color: "var(--s-sent)" }
      : { key: "sent",     label: "People reached", color: "var(--s-sent)" },
    { key: "connected", label: "Connected", color: "var(--s-reply)" },
    { key: "deals",    label: "Deals",   color: "var(--s-deal)" },
  ];

  function trendPanel() {
    const t = REPORT.trend || [];
    if (!t.length) return "";
    // A series with no activity in the window is dropped rather than drawn flat
    // along zero — an empty line reads as a data error.
    const active = SERIES.filter((s) => t.some((w) => w[s.key] > 0));
    return '<div class="panel">' +
      '<div class="chart-head"><div>' +
        "<h2>Weekly activity</h2>" +
        '<div class="panel-note">Report weeks run Monday to Sunday, so each one contains ' +
        "the EOW's Mon–Sat window exactly.</div>" +
      "</div>" +
      '<div class="legend">' + active.map((s) =>
        '<span class="legend-item"><span class="swatch" style="background:' + s.color + '"></span>' +
        esc(s.label) + "</span>").join("") +
      '<button class="toggle" id="tbl-toggle">Table</button>' +
      "</div></div>" +
      '<div class="chart-scroll" id="chart-host"></div>' +
      '<div class="table-scroll" id="trend-table" hidden></div>' +
    "</div>";
  }

  function drawChart() {
    const host = $("chart-host");
    if (!host) return;
    let data = REPORT.trend || [];
    // Trim leading weeks with no activity at all — a flat run along zero before
    // the first send reads as missing data and squashes the real range.
    const firstLive = data.findIndex((w) => SERIES.some((s) => (w[s.key] || 0) > 0));
    if (firstLive > 0) data = data.slice(firstLive);
    const active = SERIES.filter((s) => data.some((w) => w[s.key] > 0));
    if (!active.length) { host.innerHTML = '<div class="empty">No activity in this window.</div>'; return; }

    const W = Math.max(560, data.length * 72), H = 260;
    const P = { t: 16, r: 16, b: 34, l: 44 };
    const iw = W - P.l - P.r, ih = H - P.t - P.b;

    const maxV = Math.max(1, ...data.flatMap((w) => active.map((s) => w[s.key] || 0)));
    // Round the ceiling up to something a human reads cleanly.
    const step = Math.pow(10, Math.floor(Math.log10(maxV)));
    const top  = Math.ceil(maxV / step) * step || 1;

    const x = (i) => P.l + (data.length === 1 ? iw / 2 : (i * iw) / (data.length - 1));
    const y = (v) => P.t + ih - (v / top) * ih;

    let svg = '<svg class="chart" viewBox="0 0 ' + W + " " + H + '" role="img" ' +
              'aria-label="Weekly outbound activity">';

    for (let g = 0; g <= 4; g++) {
      const gy = P.t + (ih * g) / 4;
      svg += '<line class="grid-line" x1="' + P.l + '" y1="' + gy + '" x2="' + (W - P.r) + '" y2="' + gy + '"/>' +
             '<text class="axis-text" x="' + (P.l - 8) + '" y="' + (gy + 4) + '" text-anchor="end">' +
             Math.round(top - (top * g) / 4) + "</text>";
    }

    data.forEach((w, i) => {
      if (data.length > 8 && i % 2) return;
      svg += '<text class="axis-text" x="' + x(i) + '" y="' + (H - 12) + '" text-anchor="middle">' +
             esc(w.label) + "</text>";
    });

    active.forEach((s) => {
      const d = data.map((w, i) => (i ? "L" : "M") + x(i) + " " + y(w[s.key] || 0)).join(" ");
      svg += '<path class="series-line" stroke="' + s.color + '" d="' + d + '"/>';
      data.forEach((w, i) => {
        svg += '<circle cx="' + x(i) + '" cy="' + y(w[s.key] || 0) + '" r="4" fill="' + s.color +
               '" stroke="var(--surface)" stroke-width="2"/>';
      });
    });

    svg += '<line class="crosshair" id="crosshair" y1="' + P.t + '" y2="' + (P.t + ih) + '"/>';
    data.forEach((w, i) => {
      const half = data.length > 1 ? iw / (data.length - 1) / 2 : iw / 2;
      svg += '<rect class="hit" data-i="' + i + '" x="' + (x(i) - half) + '" y="' + P.t +
             '" width="' + half * 2 + '" height="' + ih + '"/>';
    });
    svg += "</svg>";
    host.innerHTML = svg;

    const tip = $("tooltip"), cross = $("crosshair");
    host.querySelectorAll(".hit").forEach((r) => {
      r.addEventListener("mousemove", (ev) => {
        const w = data[+r.dataset.i];
        cross.setAttribute("x1", x(+r.dataset.i));
        cross.setAttribute("x2", x(+r.dataset.i));
        cross.style.display = "block";
        tip.innerHTML = '<div class="tt-title">' + esc(w.label) + "</div>" +
          active.map((s) =>
            '<div class="tt-row"><span class="swatch" style="background:' + s.color + '"></span>' +
            esc(s.label) + "<b>" + num(w[s.key] || 0) + "</b></div>").join("");
        tip.style.display = "block";
        tip.style.left = Math.min(ev.clientX + 14, window.innerWidth - 165) + "px";
        tip.style.top  = (ev.clientY - 12) + "px";
      });
      r.addEventListener("mouseleave", () => {
        tip.style.display = "none"; cross.style.display = "none";
      });
    });

    // Table view — identity never depends on colour alone.
    const tbl = $("trend-table");
    tbl.innerHTML = "<table><thead><tr><th>Week</th>" +
      active.map((s) => '<th class="num">' + esc(s.label) + "</th>").join("") +
      "</tr></thead><tbody>" + data.map((w) =>
        "<tr><td>" + esc(w.label) + "</td>" +
        active.map((s) => '<td class="num">' + num(w[s.key] || 0) + "</td>").join("") + "</tr>"
      ).join("") + "</tbody></table>";

    $("tbl-toggle").addEventListener("click", (e) => {
      const showing = !tbl.hidden;
      tbl.hidden = showing;
      host.hidden = !showing;
      e.target.textContent = showing ? "Table" : "Chart";
    });
  }

  /* ── Campaign breakdown ────────────────────────────────────────────────── */
  function campaignPanel() {
    const rows = REPORT.campaigns || [];
    if (!rows.length) return "";
    return '<div class="panel"><h2>Campaign breakdown</h2>' +
      '<div class="panel-note">Ranked by deals, then volume. ' +
      "“Targeted” is the sendlist; “sent” is what HubSpot confirms went out.</div>" +
      '<div class="table-scroll"><table><thead><tr>' +
        "<th>Campaign</th><th>Sector</th>" +
        '<th class="num">Targeted</th><th class="num">Sent</th>' +
        '<th class="num">Deals</th><th>Window</th>' +
      "</tr></thead><tbody>" + rows.map((r) =>
        "<tr>" +
          '<td class="name">' + esc(r.label) + "</td>" +
          '<td class="dim">' + esc(r.sector) + "</td>" +
          '<td class="num">' + num(r.targeted) + "</td>" +
          '<td class="num">' + num(r.sent) + "</td>" +
          '<td class="num">' + num(r.deals) + "</td>" +
          '<td class="dim">' + esc(r.first_send || "—") +
            (r.last_send && r.last_send !== r.first_send ? " → " + esc(r.last_send) : "") + "</td>" +
        "</tr>").join("") + "</tbody></table></div></div>";
  }

  /* ── Results ───────────────────────────────────────────────────────────── */
  function resultsPanel() {
    const crm = REPORT.results || [], wins = REPORT.wins || [];
    if (!crm.length && !wins.length) {
      return '<div class="panel"><h2>Calls &amp; deals</h2>' +
        '<div class="panel-note">Nothing linked yet — see the note above.</div></div>';
    }
    let html = '<div class="panel"><h2>Calls &amp; deals</h2>' +
      '<div class="panel-note">Only deals whose HubSpot Lead Source reads ' +
      "<b>Vendor Campaign</b> count here — that tag is the deciding vote on whether a deal " +
      "belongs to this campaign, so unrelated work never leaks in. Manual rows come " +
      "from <code>wins.csv</code> and stay until the deal exists in HubSpot.</div>" +
      '<div class="table-scroll"><table><thead><tr>' +
        "<th>Company</th><th>Contact</th><th>Lead Source</th><th>Campaign</th>" +
        "<th>Stage / outcome</th>" +
        '<th class="num">Amount</th><th>Date</th><th>Logged</th>' +
      "</tr></thead><tbody>";

    html += crm.map((r) =>
      "<tr>" +
        '<td class="name">' + esc(r.company || "—") + "</td>" +
        "<td>" + esc(r.name) + "</td>" +
        "<td>" + (r.lead_source
          ? '<span class="pill src">' + esc(r.lead_source) + "</span>"
          : '<span class="dim">not set</span>') + "</td>" +
        '<td class="dim">' + esc(r.campaign) + "</td>" +
        "<td>" + esc(r.stage || "—") +
          (r.attribution === "company" ? ' <span class="dim">(via company)</span>' : "") + "</td>" +
        '<td class="num">' + (r.amount ? money(r.amount) : "—") + "</td>" +
        '<td class="dim">' + esc(r.created || "—") + "</td>" +
        '<td><span class="pill live">CRM</span></td>' +
      "</tr>").join("");

    html += wins.map((w) =>
      "<tr>" +
        '<td class="name">' + esc(w.company) + "</td>" +
        "<td>" + esc(w.contact || "—") + "</td>" +
        '<td class="dim">—</td>' +
        '<td class="dim">' + esc(w.campaign || "—") + "</td>" +
        "<td>" + esc(w.outcome || "—") +
          (w.note ? ' <span class="dim">— ' + esc(w.note) + "</span>" : "") + "</td>" +
        '<td class="num">—</td>' +
        '<td class="dim">' + esc(w.date || "—") + "</td>" +
        '<td><span class="pill manual">Manual</span></td>' +
      "</tr>").join("");

    html += "</tbody></table></div>";

    const notes = REPORT.deal_notes || [];
    if (notes.length) {
      html += '<ul class="hl" style="margin-top:18px">' +
        notes.map((n) => "<li>" + esc(n) + "</li>").join("") + "</ul>";
    }

    // Anything the association matched but the tag rejected. Usually empty; when
    // it is not, it is either genuinely other work or a missing tag to fix.
    const skipped = REPORT.excluded_deals || [];
    if (skipped.length) {
      html += '<div class="panel-note" style="margin:22px 0 10px">' +
        "<b>" + num(skipped.length) + "</b> deal" + (skipped.length === 1 ? "" : "s") +
        " at these companies are <b>not</b> counted — Lead Source does not say " +
        "Vendor Campaign. Set the tag if one belongs to this campaign.</div>" +
        '<div class="table-scroll"><table><thead><tr>' +
          "<th>Deal</th><th>Company</th><th>Lead Source</th><th>Stage</th><th>Created</th>" +
        "</tr></thead><tbody>" + skipped.map((r) =>
          "<tr>" +
            '<td class="name">' + esc(r.deal || "—") + "</td>" +
            '<td class="dim">' + esc(r.company || "—") + "</td>" +
            '<td class="dim">' + esc(r.lead_source) + "</td>" +
            "<td>" + esc(r.stage || "—") + "</td>" +
            '<td class="dim">' + esc(r.created || "—") + "</td>" +
          "</tr>").join("") + "</tbody></table></div>";
    }

    return html + "</div>";
  }

  /* ── Who replied (human-verified, from the EOW) ────────────────────────── */
  function connectedPanel() {
    const weeks = REPORT.weekly || [];
    const rows = [];
    weeks.forEach((w) => (w.connected_detail || []).forEach((d) =>
      rows.push({ week: w.label, who: d })));

    const noted = REPORT.totals.thread_notifications;
    let html = '<div class="panel"><h2>Who replied</h2>' +
      '<div class="panel-note">Genuine human replies, from the weekly update. ' +
      "HubSpot is deliberately not the source: its reply field logs Mailsuite " +
      "“not opened yet” notifications as replies" +
      (noted ? " (" + num(noted) + " across these contacts)" : "") +
      ", so it tracks the opposite of engagement.</div>";

    // Replies from other work are deducted in weekly.json and stay there for
    // traceability, but they are not shown — this report is about the campaign.
    if (!rows.length) {
      return html + '<div class="empty">No replies recorded in the reported weeks.</div></div>';
    }
    if (rows.length) {
      html += '<div class="table-scroll"><table><thead><tr>' +
        "<th>Week</th><th>Who, and what came back</th></tr></thead><tbody>" +
        rows.map((r) => "<tr><td>" + esc(r.week) + '</td><td class="name">' +
          esc(r.who) + "</td></tr>").join("") +
        "</tbody></table></div>";
    }
    return html + "</div>";
  }

  // Deliberate order: this week, the headline numbers, then what came of them.
  // The 12-week chart and the per-campaign table are reference material, so they
  // sit underneath rather than competing with the current week.
  $("app").innerHTML = weeklyPanel() + kpis() + notice() +
                       resultsPanel() + connectedPanel() +
                       trendPanel() + campaignPanel();
  drawChart();

  const wkToggle = $("wk-toggle"), wkEarlier = $("wk-earlier");
  if (wkToggle && wkEarlier) {
    wkToggle.addEventListener("click", (e) => {
      wkEarlier.hidden = !wkEarlier.hidden;
      e.target.textContent = wkEarlier.hidden ? "Earlier weeks" : "Hide earlier";
    });
  }
})();
</script>
</body>
</html>
